<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.js Mobile Demo</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #222; }
        .box { width: 50px; height: 50px; background-color: #00ffcc; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="box"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <script>
        anime({
            targets: '.box',
            translateX: 150,
            borderRadius: '50%',
            duration: 2000,
            easing: 'easeInOutQuad',
            direction: 'alternate',
            loop: true
        });
    </script>
</body>
</html>
